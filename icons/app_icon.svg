<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00CED1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="url(#ringGradient)" stroke="#FFFFFF" stroke-width="8"/>
  
  <!-- Main background circle -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGradient)"/>
  
  <!-- Video camera icon -->
  <g transform="translate(256, 256)">
    <!-- Camera body -->
    <rect x="-80" y="-50" width="160" height="100" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <rect x="-70" y="-40" width="140" height="80" rx="8" fill="#1a1a1a"/>
    
    <!-- Lens -->
    <circle cx="0" cy="0" r="35" fill="#2a2a2a" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="25" fill="#1a1a1a"/>
    <circle cx="0" cy="0" r="15" fill="#0a0a0a"/>
    
    <!-- Recording indicator dot -->
    <circle cx="50" cy="-30" r="12" fill="#FF0000"/>
    <circle cx="50" cy="-30" r="8" fill="#FFFFFF"/>
  </g>
  
  <!-- NDI text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0.9">NDI</text>
</svg>

